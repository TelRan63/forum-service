services:
  view:
    image: eddfish/accounting
    container_name: accounting
    ports:
      - "80:80"
    depends_on:
      - forum-service
  forum-service:
    image: eddfish/forum-service
    container_name: forum-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_NAME=java63
      - MONGO_URI=mongodb://edd:1234@db:27017?authSource=admin
    depends_on:
      - db
  db:
    image: mongo:8.0.6
    volumes:
      - mongo_volume:/data/db

volumes:
  mongo_volume:
    external: true
    name: mongo_volume
